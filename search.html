<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; padding: 12px; color: #1e293b; padding-bottom: 70px; }
        .max-width-container { max-width: 700px; margin: 0 auto; }
        .search-input { width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 15px; box-sizing: border-box; background: white; margin-bottom: 15px; }
        .tag { display: inline-block; background: #e2e8f0; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin: 4px; color: #334155; cursor: pointer; }
    </style>
    <script src="components.js" defer></script>
</head>
<body>
    <div class="max-width-container">
        <city-header></city-header>
        
        <input type="text" class="search-input" placeholder="🔍 Search news, movies, channels...">

        <div style="font-weight: 700; font-size: 14px; margin-bottom: 8px; color: #0f172a;">🔥 Trending Local Searches</div>
        <div>
            <span class="tag">#AajTakLive</span>
            <span class="tag">#LocalNews</span>
            <span class="tag">#KidsCartoons</span>
            <span class="tag">#BlockbusterMovies</span>
        </div>

        <bottom-nav></bottom-nav>
    </div>
</body>
</html>
