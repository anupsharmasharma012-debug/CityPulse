<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Profile</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --primary: #007a99;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden !important;
            overscroll-behavior-x: none !important;
            position: relative;
            background-color: var(--bg-color);
            color: var(--text-main);
        }
        .profile-container { 
            width: 100%; 
            max-width: 420px; 
            margin: 0 auto;
            min-height: 100vh; 
            padding: 16px; 
            padding-bottom: 85px; 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            overflow-x: hidden !important;
        }
        .bottom-nav { 
            position: fixed; 
            bottom: 0; left: 50%; transform: translateX(-50%); 
            width: 100%; max-width: 420px; height: 65px; 
            background: #0f3443; 
            display: grid; grid-template-columns: repeat(6, 1fr); align-items: center; 
            z-index: 9999; 
        }
        .nav-item { text-align: center; color: #b0c4de; font-size: 9px; font-weight: 600; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: #00e5ff; }
    </style>
</head>
<body>
<div class="profile-container">
    <h2>Citizen Profile</h2>
    <p>Profile content here...</p>
</div>
<div class="bottom-nav">
    <a href="index.html" class="nav-item">🏠 Home</a>
    <a href="profile.html" class="nav-item active">👤 Profile</a>
</div>
</body>
</html>
