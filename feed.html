<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Cinematic Media & Live TV Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #090a0f;
            --card-bg: #131620;
            --card-border: #1f2433;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); margin: 0; padding: 12px; color: var(--text-main); padding-bottom: 80px; }
        .max-width-container { max-width: 700px; margin: 0 auto; }
        
        .page-header { background: linear-gradient(135deg, #1e2330, var(--card-bg)); border: 1px solid var(--card-border); color: #fff; padding: 14px; border-radius: 16px; text-align: center; font-weight: 900; font-size: 16px; margin-bottom: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
        
        /* Smooth Horizontal Scrolling Categories */
        .sub-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 18px; scrollbar-width: none; }
        .sub-tabs::-webkit-scrollbar { display: none; }
        .tab-btn { background: var(--card-bg); border: 1px solid var(--card-border); padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; color: var(--text-muted); transition: all 0.2s; }
        .tab-btn.active { background: var(--accent-red); color: white; border-color: var(--accent-red); box-shadow: 0 4px 15px rgba(239,68,68,0.4); }

        .ad-banner { background: rgba(245,158,11,0.1); border: 1px dashed rgba(245,158,11,0.4); padding: 12px; border-radius: 12px; text-align: center; margin-bottom: 18px; color: #fbbf24; }
        
        /* Cinematic Media Cards */
        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-left: 4px solid var(--accent-red); padding: 16px; border-radius: 16px; margin-bottom: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
        .video-box { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 12px; overflow: hidden; margin-top: 12px; border: 1px solid var(--card-border); }
        .video-box iframe, .video-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="components.js" defer></script>
</head>
<body>
    <div class="max-width-container">
        <city-header></city-header>
        <div class="page-header">📺 CityPulse Live Media & OTT Hub</div>

        <!-- Global Ad Slot -->
        <div id="adSlot"></div>

        <!-- Master Category Sub-Tabs -->
        <div class="sub-tabs">
            <button class="tab-btn active" onclick="filterNews('All', this)">🔥 All</button>
            <button class="tab-btn" onclick="filterNews('News_Live', this)">📡 Live TV</button>
            <button class="tab-btn" onclick="filterNews('News_Headlines', this)">⚡ Headlines</button>
            <button class="tab-btn" onclick="filterNews('News_Local', this)">📍 Hyper-Local</button>
            <button class="tab-btn" onclick="filterNews('News_National', this)">🏛️ National</button>
            <button class="tab-btn" onclick="filterNews('News_Politics', this)">⚖️ Politics</button>
            <button class="tab-btn" onclick="filterNews('News_Crime', this)">🚨 Crime</button>
            <button class="tab-btn" onclick="filterNews('News_Business', this)">📈 Business</button>
            <button class="tab-btn" onclick="filterNews('News_Sports', this)">🏆 Sports</button>
            <button class="tab-btn" onclick="filterNews('News_World', this)">🌍 World</button>
            <button class="tab-btn" onclick="filterNews('News_Science', this)">🔬 Science</button>
            <button class="tab-btn" onclick="filterNews('News_FactCheck', this)">✅ Fact Check</button>
            <button class="tab-btn" onclick="filterNews('News_Reels', this)">📸 Reels</button>
        </div>

        <div id="newsFeed" style="text-align: center; color: var(--text-muted); padding: 40px;">Cinematic streams load ho rahe hain...</div>
        <bottom-nav></bottom-nav>
    </div>

    <script>
        const supabaseUrl = 'https://qfefkyrwxdhdxyajutst.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmZWZreXJ3eGRoZHh5YWp1dHN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMjY0ODcsImV4cCI6MjEwMjgwMjQ4N30.lmnKyvigM5JeVf1y_BR0tjqAp4PiXioZNcCE5VVYsKg';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        let allNews = [];

        async function fetchNewsData() {
            let combinedData = [];

            try {
                const { data } = await supabaseClient.from('media_hub').select('*').eq('status', 'active').order('created_at', { ascending: false });
                if(data) {
                    const ads = data.filter(i => i.category === 'Ad_Banner');
                    if(ads.length > 0) {
                        document.getElementById('adSlot').innerHTML = `
                            <div class="ad-banner">
                                <span style="font-size:9px; background:#d97706; color:white; padding:2px 6px; border-radius:4px; font-weight:700;">SPONSORED</span>
                                <div style="font-weight:700; font-size:13px; margin-top:4px; color:#fff;">${ads[0].title}</div>
                                <div style="margin-top:4px; font-size:12px; color:#cbd5e1;">${ads[0].location}</div>
                            </div>`;
                    }
                    combinedData = data.filter(i => i.category.startsWith('News_') || i.category === 'News');
                }
            } catch(err) {
                console.error("Supabase error:", err);
            }

            try {
                const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss?hl=en-IN&gl=IN&ceid=IN:en');
                const rssData = await response.json();
                if(rssData && rssData.items) {
                    rssData.items.forEach((item, index) => {
                        combinedData.push({
                            id: 'api-' + index,
                            title: item.title,
                            category: index % 2 === 0 ? 'News_Headlines' : 'News_National',
                            location: `<div style="padding:15px; background:#181d2a; border-radius:8px;"><p style="margin:0 0 10px 0; font-size:13px; color:#cbd5e1;">${item.description || 'Click below to read full live news update.'}</p><a href="${item.link}" target="_blank" style="background:var(--accent-red); color:white; padding:6px 12px; border-radius:6px; text-decoration:none; font-size:12px; font-weight:700; display:inline-block;">🔗 Read Full Article</a></div>`,
                            created_at: item.pubDate
                        });
                    });
                }
            } catch(apiErr) {
                console.log("RSS notice active");
            }

            allNews = combinedData;
            renderList(allNews);
        }

        function filterNews(cat, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(cat === 'All') renderList(allNews);
            else renderList(allNews.filter(i => i.category === cat));
        }

        function renderList(items) {
            const feed = document.getElementById('newsFeed');
            if(items.length === 0) return feed.innerHTML = `<div style="text-align:center; padding:30px; background:var(--card-bg); border-radius:12px; color:var(--text-muted); border:1px solid var(--card-border);">Is category mein abhi koi live stream ya khabar uplabdh nahi hai.</div>`;
            
            let html = '';
            items.forEach(item => {
                html += `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <div style="font-size: 15px; font-weight: 700; color: #fff; line-height: 1.4;">${item.title}</div>
                            <span style="font-size:9px; background:rgba(239,68,68,0.2); color:#fca5v5; border:1px solid rgba(239,68,68,0.4); padding:3px 8px; border-radius:4px; font-weight:700; text-transform:uppercase; white-space:nowrap; margin-left:8px;">${item.category.replace('News_', '')}</span>
                        </div>
                        <div class="video-box">${item.location}</div>
                    </div>`;
            });
            feed.innerHTML = html;
        }

        fetchNewsData();
    </script>
</body>
</html>
