<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Login</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #f4f6f9; 
            display: flex;
            justify-content: center;
        }
        
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #005C7A; 
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #splash-screen h1 { font-size: 45px; margin: 0; color: #ffffff; }
        #splash-screen p { font-size: 18px; color: #99cce0; margin-top: 10px; }
        
        .login-container { 
            width: 100%;
            max-width: 400px; 
            min-height: 100vh;
            background: linear-gradient(145deg, #007a99, #005C7A, #004865); 
            color: white;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .logo-section h1 { font-size: 38px; margin: 0 0 15px 0; font-weight: bold; letter-spacing: 1px; }
        .logo-circle { width: 110px; height: 110px; border: 3px solid white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 50px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .text-section h2 { font-size: 15px; font-weight: bold; margin: 0 0 10px 0; letter-spacing: 1px; }
        .text-section p { font-size: 14px; margin: 0; color: #b3e0ff; }
        .button-section { width: 100%; display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .login-btn { background-color: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.4); color: white; padding: 15px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .login-btn:hover { background-color: rgba(255, 255, 255, 0.3); border-color: white; }
        .footer-text { font-size: 12px; color: #b3e0ff; margin-top: 30px; line-height: 1.6; }
        .footer-text a { color: white; text-decoration: underline; font-weight: bold; }

        #phone-auth-box {
            display: none;
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 15px;
            box-sizing: border-box;
            margin-top: 15px;
        }

        .phone-input-group {
            display: flex;
            align-items: center;
            background: #ffffff;
            border-radius: 25px;
            padding: 0 15px;
            margin: 10px auto;
            width: 90%;
            box-sizing: border-box;
        }
        .country-code {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            padding-right: 8px;
            border-right: 1px solid #ccc;
            user-select: none;
        }
        .phone-input-group input {
            border: none;
            outline: none;
            padding: 12px 10px;
            font-size: 15px;
            width: 100%;
            border-radius: 0 25px 25px 0;
            color: #333;
        }

        .otp-input {
            width: 85%;
            padding: 12px;
            margin: 8px auto;
            border-radius: 25px;
            border: 1px solid #fff;
            background: #ffffff;
            color: #333;
            font-size: 16px;
            outline: none;
            text-align: center;
            letter-spacing: 2px;
            font-weight: bold;
        }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
</head>
<body>

<div id="splash-screen">
    <h1>CityPulse</h1>
    <p>Loading Super Services...</p>
</div>

<div id="login-app" class="login-container">
    <div class="logo-section">
        <h1>CityPulse</h1>
        <div class="logo-circle">🏙️</div> 
    </div>
    <div class="text-section">
        <h2>CONTINUE TO SIGN UP FOR FREE</h2>
        <p>If you already have an account,<br>we will log you in</p>
    </div>
    
    <div class="button-section">
        <button class="login-btn" onclick="togglePhoneBox()">📞 Continue with phone number</button>

        <div id="phone-auth-box">
            <div id="step-phone">
                <div class="phone-input-group">
                    <span class="country-code">🇮🇳 +91</span>
                    <input type="tel" id="user-phone" placeholder="Enter 10-digit number" maxlength="10">
                </div>
                <button class="login-btn" style="padding: 10px; width: 90%; margin: 5px auto;" onclick="sendOTP()">Send OTP</button>
            </div>

            <div id="step-otp" style="display: none;">
                <input type="text" id="user-otp" class="otp-input" placeholder="Enter 6-digit OTP" maxlength="6">
                <button class="login-btn" style="padding: 10px; width: 90%; margin: 5px auto;" onclick="verifyOTP()">Verify & Login</button>
            </div>
        </div>

        <button class="login-btn" onclick="loginWithGoogle()">G Continue with Google</button>
        <button class="login-btn" onclick="alert('Email login coming soon!')">✉️ Continue with email</button>
        <button class="login-btn" onclick="window.location.href='index.html'">••• Skip / Guest Mode</button>
    </div>

    <div id="recaptcha-container"></div>

    <div class="footer-text">
        By continuing, you agree to CityPulse's <br>
        <a href="#">TERMS OF USE</a>. Read our <a href="#">PRIVACY POLICY</a>.
    </div>
</div>

<script>
    setTimeout(function() {
        document.getElementById('splash-screen').style.display = 'none';
        document.getElementById('login-app').style.display = 'flex';
    }, 3000);

    const firebaseConfig = {
        apiKey: "AIzaSyClIWguv8WBR8DCSO5Gx1H9xjeQVzYwKo0",
        authDomain: "citypulse-fcc77.firebaseapp.com",
        projectId: "citypulse-fcc77",
        storageBucket: "citypulse-fcc77.firebasestorage.app",
        messagingSenderId: "579500734980",
        appId: "1:579500734980:web:7f8f847b617f6e586dd351",
        measurementId: "G-B5Q0PXFGKD"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function togglePhoneBox() {
        const box = document.getElementById('phone-auth-box');
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
        if (!window.recaptchaVerifier) {
            window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                'size': 'invisible'
            });
        }
    }

    function sendOTP() {
        const rawNumber = document.getElementById('user-phone').value.trim();

        if (rawNumber.length !== 10 || isNaN(rawNumber)) {
            alert('कृपया सही 10 अंकों का मोबाइल नंबर डालें');
            return;
        }

        const phoneNumber = "+91" + rawNumber;
        const appVerifier = window.recaptchaVerifier;

        auth.signInWithPhoneNumber(phoneNumber, appVerifier)
            .then((confirmationResult) => {
                window.confirmationResult = confirmationResult;
                alert('OTP Sent Successfully!');
                document.getElementById('step-phone').style.display = 'none';
                document.getElementById('step-otp').style.display = 'block';
            }).catch((error) => {
                alert('Error: ' + error.message);
            });
    }

    function verifyOTP() {
        const code = document.getElementById('user-otp').value.trim();
        
        if (code.length < 6) {
            alert('कृपया 6 अंकों का OTP दर्ज करें');
            return;
        }

        window.confirmationResult.confirm(code).then((result) => {
            alert('Login Successful!');
            window.location.href = 'biometric.html';
        }).catch((error) => {
            alert('Invalid OTP. Please check again.');
        });
    }

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider)
            .then((result) => {
                alert('Welcome, ' + (result.user.displayName || 'User'));
                window.location.href = 'biometric.html';
            }).catch((error) => {
                alert('Google Sign-in Error: ' + error.message);
            });
    }
</script>

</body>
</html>
