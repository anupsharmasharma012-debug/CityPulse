<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Login & Authentication</title>
    <!-- [CSS] LINKED TO MASTER STYLESHEET -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* ==========================================
           [CSS] PAGE-SPECIFIC CUSTOM STYLES START
           ========================================== */
        :root { --success: #10b981; }
        body.dark-theme { --success: #10b981; }
        
        /* Header Layout Styles */
        .header { display: flex; align-items: center; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .back-btn { background: none; border: none; font-size: 22px; color: var(--text-main); cursor: pointer; }
        .header h1 { font-size: 18px; font-weight: bold; }

        /* Login Card Container */
        .login-card { background: var(--card-bg); border-radius: 16px; padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.02); text-align: center; margin-top: 20px; }
        .login-logo { font-size: 48px; margin-bottom: -4px; }
        .login-title { font-size: 18px; font-weight: 800; color: var(--text-main); }
        .login-sub { font-size: 12px; color: var(--text-sub); line-height: 1.4; }

        /* Input Group */
        .phone-input-box { display: flex; align-items: center; background: var(--bg-color); border: 1px solid var(--border); border-radius: 10px; padding: 4px 12px; gap: 8px; }
        .country-code { font-size: 14px; font-weight: 700; color: var(--text-main); border-right: 1px solid var(--border); padding-right: 8px; }
        .phone-input { width: 100%; padding: 10px 0; border: none; background: transparent; outline: none; font-size: 15px; color: var(--text-main); font-weight: 600; letter-spacing: 0.5px; }

        .submit-btn { background: var(--primary); color: white; padding: 14px; border-radius: 10px; border: none; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; box-shadow: 0 4px 6px rgba(0, 122, 153, 0.2); transition: 0.2s; }
        .submit-btn:active { opacity: 0.9; transform: scale(0.99); }

        .privacy-note { font-size: 10px; color: var(--text-sub); text-align: center; margin-top: 8px; }
        /* ==========================================
           [CSS] PAGE-SPECIFIC CUSTOM STYLES END
           ========================================== */
    </style>
</head>
<body>

<!-- [HTML] MAIN CONTENT CONTAINER START -->
<div class="page-container">
    
    <!-- [HTML] HEADER SECTION START -->
    <div class="header">
        <button class="back-btn" onclick="history.back()">←</button>
        <h1>Sign In / Register</h1>
    </div>
    <!-- [HTML] HEADER SECTION END -->

    <!-- [HTML] LOGIN CARD START -->
    <div class="login-card">
        <div class="login-logo">🌆</div>
        <div class="login-title">Welcome to CityPulse</div>
        <div class="login-sub">Enter your mobile number to access civic services, emergency SOS, and local marketplace.</div>

        <div class="phone-input-box">
            <span class="country-code">+91</span>
            <input type="tel" class="phone-input" placeholder="Enter mobile number" maxlength="10">
        </div>

        <button class="submit-btn" onclick="alert('OTP sent successfully to your mobile number!')">Get Verification OTP</button>

        <div class="privacy-note">🔒 Your data is secure & encrypted under local compliance guidelines.</div>
    </div>
    <!-- [HTML] LOGIN CARD END -->

</div>
<!-- [HTML] MAIN CONTENT CONTAINER END -->

<!-- [HTML] MODERN 5-TAB BOTTOM NAVIGATION START -->
<div class="bottom-nav">
    <a href="index.html" class="nav-item">
        <div class="nav-icon">🏠</div><span>Home</span>
    </a>
    <a href="search.html" class="nav-item">
        <div class="nav-icon">🔍</div><span>Search</span>
    </a>
    <a href="pay.html" class="nav-item">
        <div class="nav-icon">🛡️</div><span>Pay</span>
    </a>
    <a href="category.html" class="nav-item">
        <div class="nav-icon">📂</div><span>Category</span>
    </a>
    <a href="notifications.html" class="nav-item">
        <div class="nav-icon">🔔</div><span>Alerts</span>
    </a>
</div>
<!-- [HTML] MODERN 5-TAB BOTTOM NAVIGATION END -->

<!-- [JS] SCRIPT LOGIC START -->
<script>
    // Global Dark Mode Sync
    if (localStorage.getItem("citypulse_theme") === "dark") document.body.classList.add("dark-theme");
</script>
<!-- [JS] SCRIPT LOGIC END -->

</body>
</html>
