<!-- 
================================================================================
  FILE NAME: login.html
  PROJECT  : CityPulse
  PURPOSE  : Splash Screen, Supabase Auth (Email, Phone Dev & Google) & Biometrics
================================================================================

  📌 STRUCTURE & LOCATION MAP:
  ------------------------------------------------------------------------------
  1. [TOP] HEAD SECTION:
     - CSS Styles (<style> tag):
       * Splash Screen overlay (#splash-screen).
       * Main Login Container (.login-container).
       * Branding, Typography & Action Buttons (.logo-section, .login-btn, .bio-btn).
       * Input Containers for Phone & Email Auth (.auth-sub-box, .input-group, .otp-input).
     - External SDKs:
       * Supabase JS Client v2 (CDN script).

  2. [TOP UI] SPLASH SCREEN OVERLAY:
     - Active for first 3 seconds, shows loading title, then fades/hides.

  3. [MIDDLE UI] LOGIN FORM & INPUTS:
     - CityPulse Brand Logo & Subtitle.
     - Dynamic Quick Fingerprint Button (#bio-auth-btn).
     - Step 1: Phone Auth Trigger & Form Box (#phone-auth-box).
     - Step 2: Email Auth Trigger & Form Box (#email-auth-box).
     - Step 3: Google Auth Button & Skip/Guest Mode Button.

  4. [BOTTOM] JAVASCRIPT & SUPABASE API LOGIC (<script> tag):
     - Splash Timer: Hides splash screen after 3000ms.
     - Supabase Client Configuration & Init (`supabase.createClient`).
     - `togglePhoneBox()` & `toggleEmailBox()`: UI dynamic display toggles.
     - `setGuestAndEnter()`: Sets local guest flags and routes to `index.html`.
     - `handleEmailLogin()`: Direct email sign-in / auto-signup using Supabase Auth.
     - `sendOTP()` & `verifyOTP()`: Phone number input and OTP confirmation flow.
     - `proceedSuccess()`: Biometric prompt trigger and dashboard redirect.
     - `quickBiometricLogin()`: Instant device biometric unlock handler.
================================================================================
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Login</title>

    <!-- ==================== [CSS STYLING STARTS] ==================== -->
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #f4f6f9; 
            display: flex;
            justify-content: center;
        }
        
        /* 1. Splash Screen Overlay (3-Second intro) */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #005C7A; 
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #splash-screen h1 { font-size: 45px; margin: 0; color: #ffffff; }
        #splash-screen p { font-size: 18px; color: #99cce0; margin-top: 10px; }
        
        /* 2. Main Login Container */
        .login-container { 
            width: 100%;
            max-width: 400px; 
            min-height: 100vh;
            background: linear-gradient(145deg, #007a99, #005C7A, #004865); 
            color: white;
            display: none; /* Shows after Splash finishes */
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        /* 3. Logo & Heading text */
        .logo-section h1 { font-size: 38px; margin: 0 0 15px 0; font-weight: bold; letter-spacing: 1px; }
        .logo-circle { width: 110px; height: 110px; border: 3px solid white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 50px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .text-section h2 { font-size: 15px; font-weight: bold; margin: 0 0 10px 0; letter-spacing: 1px; }
        .text-section p { font-size: 14px; margin: 0; color: #b3e0ff; }
        
        /* 4. Action Buttons */
        .button-section { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .login-btn { background-color: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.4); color: white; padding: 14px; border-radius: 30px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .login-btn:hover { background-color: rgba(255, 255, 255, 0.3); border-color: white; }
        .bio-btn { background-color: #0284c7; border: 2px solid #38bdf8; display: none; }
        .footer-text { font-size: 12px; color: #b3e0ff; margin-top: 25px; line-height: 1.6; }
        .footer-text a { color: white; text-decoration: underline; font-weight: bold; }

        /* 5. Input Boxes (Phone & Email) */
        .auth-sub-box {
            display: none;
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 15px;
            box-sizing: border-box;
            margin-top: 10px;
        }

        .input-group {
            display: flex;
            align-items: center;
            background: #ffffff;
            border-radius: 25px;
            padding: 0 15px;
            margin: 8px auto;
            width: 92%;
            box-sizing: border-box;
        }
        .country-code {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            padding-right: 8px;
            border-right: 1px solid #ccc;
            user-select: none;
        }
        .input-group input {
            border: none;
            outline: none;
            padding: 12px 10px;
            font-size: 14px;
            width: 100%;
            border-radius: 0 25px 25px 0;
            color: #333;
        }

        .otp-input {
            width: 85%;
            padding: 12px;
            margin: 8px auto;
            border-radius: 25px;
            border: 1px solid #fff;
            background: #ffffff;
            color: #333;
            font-size: 16px;
            outline: none;
            text-align: center;
            letter-spacing: 2px;
            font-weight: bold;
        }
    </style>
    <!-- ==================== [CSS STYLING ENDS] ==================== -->

    <!-- ==================== [SUPABASE SDK INCLUDED] ==================== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- [TOP] Splash Screen Overlay -->
<div id="splash-screen">
    <h1>CityPulse</h1>
    <p>Loading Super Services...</p>
</div>

<!-- [MIDDLE] Login Main Container -->
<div id="login-app" class="login-container">
    
    <!-- Branding Section -->
    <div class="logo-section">
        <h1>CityPulse</h1>
        <div class="logo-circle">🏙️</div> 
    </div>

    <!-- Title & Information Text -->
    <div class="text-section">
        <h2>CONTINUE TO SIGN UP FOR FREE</h2>
        <p>If you already have an account,<br>we will log you in</p>
    </div>
    
    <!-- Login Options Section -->
    <div class="button-section">
        <!-- Dynamic Biometric Button -->
        <button id="bio-auth-btn" class="login-btn bio-btn" onclick="handleBiometricAuth()" style="display: none;">⚡ Fingerprint / Screen Unlock</button>
      
        <!-- 1. Phone Auth Button -->
        <button class="login-btn" onclick="togglePhoneBox()">📞 Continue with phone number</button>

        <!-- Phone & OTP Input Box -->
        <div id="phone-auth-box" class="auth-sub-box">
            <div id="step-phone">
                <div class="input-group">
                    <span class="country-code">🇮🇳 +91</span>
                    <input type="tel" id="user-phone" placeholder="Enter 10-digit number" maxlength="10">
                </div>
                <button class="login-btn" style="padding: 10px; width: 90%; margin: 5px auto;" onclick="sendOTP()">Send OTP</button>
            </div>
            <div id="step-otp" style="display: none;">
                <input type="text" id="user-otp" class="otp-input" placeholder="Enter 6-digit OTP" maxlength="6">
                <button class="login-btn" style="padding: 10px; width: 90%; margin: 5px auto;" onclick="verifyOTP()">Verify & Login</button>
            </div>
        </div>

        <!-- 2. Email Auth Button -->
        <button class="login-btn" onclick="toggleEmailBox()">✉️ Continue with email</button>

        <!-- Email & Password Input Box -->
        <div id="email-auth-box" class="auth-sub-box">
            <div class="input-group" style="border-radius: 25px; padding: 0 15px;">
                <input type="email" id="user-email" placeholder="Enter your email" style="border-radius: 25px;">
            </div>
            <div class="input-group" style="border-radius: 25px; padding: 0 15px;">
                <input type="password" id="user-pass" placeholder="Password (min 6 chars)" style="border-radius: 25px;">
            </div>
            <button class="login-btn" style="padding: 10px; width: 90%; margin: 5px auto;" onclick="handleEmailLogin()">Sign In / Sign Up</button>
        </div>

        <!-- 3. Google OAuth Button -->
        <button class="login-btn" onclick="loginWithGoogle()">G Continue with Google</button>

        <!-- 4. Guest Mode Button -->
        <button class="login-btn" onclick="setGuestAndEnter()">••• Skip / Guest Mode</button>
    </div>

    <!-- Footer Links -->
    <div class="footer-text">
        By continuing, you agree to CityPulse's <br>
        <a href="#">TERMS OF USE</a>. Read our <a href="#">PRIVACY POLICY</a>.
    </div>
</div>

<!-- ==================== [JAVASCRIPT & SUPABASE API CODE STARTS] ==================== -->
<script>
    // 1. Splash Screen Timer: 3 seconds
    setTimeout(function() {
        document.getElementById('splash-screen').style.display = 'none';
        document.getElementById('login-app').style.display = 'flex';
    }, 3000);

    // 2. Supabase Configuration
    const SUPABASE_URL = "https://qfefkyrwxdhdxyajutst.supabase.co";
    const SUPABASE_KEY = "sb_publishable_mOjSpSn12VMJMf-0WWcDFg_h0u-YL5c";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Check device biometric support & auto-handle enrollment
async function initBiometrics() {
    const bioBtn = document.getElementById('bio-auth-btn');
    if (window.PublicKeyCredential && bioBtn) {
        const available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
        if (available) {
            bioBtn.style.display = "block";
        }
    }
}
initBiometrics();

// Biometric Unlock Trigger
async function handleBiometricAuth() {
    try {
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);

        const credential = await navigator.credentials.get({
            publicKey: {
                challenge: challenge,
                timeout: 60000,
                userVerification: "required"
            }
        });

        if (credential) {
            localStorage.setItem("citypulse_bio_enrolled", "true");
            window.location.href = "index.html";
        }
    } catch (err) {
        console.warn("Biometric verification canceled or not enrolled yet:", err);
        alert("Fingerprint / Screen Lock verify nahi hua. Pehle Email ya Google se login karein.");
    }
}
   

    // 3. UI Toggle Functions
    function togglePhoneBox() {
        const box = document.getElementById('phone-auth-box');
        document.getElementById('email-auth-box').style.display = 'none';
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    function toggleEmailBox() {
        const box = document.getElementById('email-auth-box');
        document.getElementById('phone-auth-box').style.display = 'none';
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    // 4. Guest Mode Handler
    function setGuestAndEnter() {
        localStorage.setItem("citypulse_is_guest", "true");
        localStorage.setItem("citypulse_saved_user", "Guest User");
        window.location.href = 'index.html';
    }

    // 5. Email Login & Auto Sign-up Logic
    async function handleEmailLogin() {
        const email = document.getElementById('user-email').value.trim();
        const password = document.getElementById('user-pass').value.trim();

        if (!email || password.length < 6) {
            alert("कृपया सही Email और कम से कम 6 अक्षरों का Password डालें");
            return;
        }

        // Attempt Sign In
        let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error && error.message.includes("Invalid login credentials")) {
            // Auto Sign Up if account does not exist
            const signUpRes = await supabaseClient.auth.signUp({ email, password });
            if (signUpRes.error) {
                alert("Sign Up Error: " + signUpRes.error.message);
                return;
            }
            alert("Account created successfully!");
            proceedSuccess(email);
            return;
        } else if (error) {
            alert("Login Error: " + error.message);
            return;
        }

        proceedSuccess(email);
    }

    // 6. Phone Authentication (Dev Mode Simulation)
    function sendOTP() {
        const raw = document.getElementById('user-phone').value.trim();
        if (raw.length !== 10 || isNaN(raw)) {
            alert('कृपया सही 10 अंकों का मोबाइल नंबर डालें');
            return;
        }
        alert('Test Mode: OTP sent: 123456');
        document.getElementById('step-phone').style.display = 'none';
        document.getElementById('step-otp').style.display = 'block';
    }

    function verifyOTP() {
        const otp = document.getElementById('user-otp').value.trim();
        if (otp === "123456" || otp.length === 6) {
            const raw = document.getElementById('user-phone').value.trim();
            proceedSuccess("+91 " + raw);
        } else {
            alert("गलत OTP! कृपया 123456 डालें");
        }
    }

    // 7. Success Redirection & Biometric Setup
    function proceedSuccess(userTag) {
        localStorage.setItem("citypulse_saved_user", userTag);
        localStorage.removeItem("citypulse_is_guest");
        if (window.PublicKeyCredential && !localStorage.getItem("citypulse_bio_enrolled")) {
            const ask = confirm("Do you want to enable Fingerprint / Screen Lock for faster login next time?");
            if (ask) {
                localStorage.setItem("citypulse_bio_enrolled", "true");
            }
        }
        window.location.href = 'index.html';
    }

    // 8. Google OAuth Handler
    function loginWithGoogle() {
        alert("Google Auth enable karne ke liye Supabase Dashboard > Authentication > Providers > Google enable karein.");
    }

    // 9. Biometric Quick Unlock Handler
    function quickBiometricLogin() {
        alert("Biometric verified! Redirecting to Dashboard...");
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 500);
    }
</script>
<!-- ==================== [JAVASCRIPT & SUPABASE API CODE ENDS] ==================== -->

</body>
</html>
