<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Login</title>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: linear-gradient(145deg, #007a99, #005C7A, #004865); display: flex; justify-content: center; align-items: center; height: 100vh; color: white; text-align: center; }
        .container { width: 100%; max-width: 400px; padding: 20px; }
        .logo { font-size: 50px; margin-bottom: 20px; }
        .login-btn { background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.4); color: white; padding: 15px; border-radius: 30px; font-size: 15px; font-weight: bold; width: 100%; margin-bottom: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏙️</div>
        <h1 style="margin-bottom: 5px;">CityPulse</h1>
        <p style="margin-bottom: 40px; font-size: 14px; color: #b3e0ff;">Municipal Services Portal</p>
        
        <button class="login-btn" onclick="loginWithGoogle()">G Continue with Google</button>
        <button class="login-btn" onclick="continueAsGuest()" style="border:none; text-decoration:underline;">Skip as Guest User</button>
    </div>

    <script>
        const supabase = supabase.createClient("https://qfefkyrwxdhdxyajutst.supabase.co", "sb_publishable_mOjSpSn12VMJMf-OWwCDFg_h0u-YL5c");
        
        (async function checkLogin() {
            // FIX: Agar URL mein Google ka token hai, toh bypass karein
            if (window.location.hash.includes("access_token")) {
                window.location.replace("index.html" + window.location.hash);
                return;
            }
            
            const { data: { session } } = await supabase.auth.getSession();
            if (session?.user || localStorage.getItem("citypulse_saved_user")) { 
                window.location.replace("index.html"); 
            }
        })();

        async function loginWithGoogle() { 
            await supabase.auth.signInWithOAuth({ 
                provider: 'google', 
                options: { redirectTo: window.location.origin + window.location.pathname.replace('login.html', 'index.html') } 
            }); 
        }

        function continueAsGuest() {
            localStorage.setItem("citypulse_is_guest", "true");
            localStorage.setItem("citypulse_saved_user", "Guest User");
            window.location.replace('index.html');
        }
    </script>
</body>
</html>
