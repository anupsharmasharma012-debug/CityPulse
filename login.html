<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; display: flex; justify-content: center; }
        
        #splash-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #005C7A; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        #splash-screen h1 { font-size: 42px; margin: 0; color: #ffffff; }
        #splash-screen p { font-size: 16px; color: #99cce0; margin-top: 8px; }
        
        .login-container { width: 100%; max-width: 420px; min-height: 100vh; background: linear-gradient(145deg, #007a99, #005C7A, #004865); color: white; display: none; flex-direction: column; align-items: center; justify-content: space-evenly; padding: 24px 20px; box-sizing: border-box; text-align: center; }
        .logo-section h1 { font-size: 36px; margin: 0 0 12px 0; font-weight: bold; }
        .logo-circle { width: 100px; height: 100px; border: 3px solid white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 46px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .text-section h2 { font-size: 15px; font-weight: bold; margin: 0 0 8px 0; letter-spacing: 0.5px; }
        .text-section p { font-size: 13px; margin: 0; color: #b3e0ff; }
        
        .button-section { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .login-btn { background-color: rgba(255, 255, 255, 0.12); border: 1.5px solid rgba(255, 255, 255, 0.4); color: white; padding: 13px; border-radius: 30px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .bio-btn { background-color: #0284c7; border: 1.5px solid #38bdf8; display: none; }
        
        .auth-sub-box { display: none; width: 100%; background: rgba(255, 255, 255, 0.15); padding: 14px; border-radius: 15px; box-sizing: border-box; }
        .input-group { display: flex; align-items: center; background: #ffffff; border-radius: 25px; padding: 0 15px; margin: 6px auto; width: 100%; box-sizing: border-box; }
        .input-group input { border: none; outline: none; padding: 11px 10px; font-size: 14px; width: 100%; border-radius: 25px; color: #333; }
        .otp-input { width: 100%; padding: 11px; margin: 6px auto; border-radius: 25px; border: 1px solid #fff; text-align: center; font-size: 16px; font-weight: bold; outline: none; }
    </style>
</head>
<body>

<div id="splash-screen">
    <h1>CityPulse</h1>
    <p>Loading Municipal Portal...</p>
</div>

<div id="login-app" class="login-container">
    <div class="logo-section">
        <h1>CityPulse</h1>
        <div class="logo-circle">🏙️</div> 
    </div>

    <div class="text-section">
        <h2>SIGN IN TO CITYPULSE</h2>
        <p>Access city services, alerts and civic utilities</p>
    </div>
    
    <div class="button-section">
        <button id="bio-auth-btn" class="login-btn bio-btn" onclick="handleBiometricAuth()">⚡ Quick Unlock (Biometrics)</button>
      
        <button class="login-btn" onclick="togglePhoneBox()">📞 Continue with phone number</button>
        <div id="phone-auth-box" class="auth-sub-box">
            <div id="step-phone">
                <div class="input-group"><input type="tel" id="user-phone" placeholder="10-digit mobile number" maxlength="10"></div>
                <button class="login-btn" style="padding: 10px; width: 100%; margin-top: 6px;" onclick="sendOTP()">Send OTP</button>
            </div>
            <div id="step-otp" style="display: none;">
                <input type="text" id="user-otp" class="otp-input" placeholder="Enter 123456" maxlength="6">
                <button class="login-btn" style="padding: 10px; width: 100%; margin-top: 6px;" onclick="verifyOTP()">Verify & Login</button>
            </div>
        </div>

        <button class="login-btn" onclick="toggleEmailBox()">✉️ Continue with email</button>
        <div id="email-auth-box" class="auth-sub-box">
            <div class="input-group"><input type="email" id="user-email" placeholder="Enter your email"></div>
            <div class="input-group"><input type="password" id="user-pass" placeholder="Password"></div>
            <button class="login-btn" style="padding: 10px; width: 100%; margin-top: 6px;" onclick="handleEmailLogin()">Sign In / Sign Up</button>
        </div>

        <button class="login-btn" onclick="loginWithGoogle()">G Continue with Google</button>
        <button class="login-btn" onclick="setGuestAndEnter()" style="border:none; text-decoration:underline;">••• Skip as Guest</button>
    </div>
</div>

<script>
    const supabaseClient = supabase.createClient("https://qfefkyrwxdhdxyajutst.supabase.co", "sb_publishable_mOjSpSn12VMJMf-OWwCDFg_h0u-YL5c");

    (async function initLogin() {
        // Handle Google Auth Loop Fix
        if (window.location.hash.includes("access_token")) {
            window.location.replace("index.html" + window.location.hash);
            return;
        }

        setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('login-app').style.display = 'flex';
        }, 1200);

        const savedUser = localStorage.getItem("citypulse_saved_user");
        const { data: { session } } = await supabaseClient.auth.getSession();
        if ((session && session.user) || savedUser) {
            window.location.replace("index.html");
        }
        if (window.PublicKeyCredential && localStorage.getItem("citypulse_bio_enrolled") === "true") {
            document.getElementById('bio-auth-btn').style.display = "block";
        }
    })();

    function togglePhoneBox() { document.getElementById('phone-auth-box').style.display = 'block'; document.getElementById('email-auth-box').style.display = 'none'; }
    function toggleEmailBox() { document.getElementById('email-auth-box').style.display = 'block'; document.getElementById('phone-auth-box').style.display = 'none'; }

    function setGuestAndEnter() { localStorage.setItem("citypulse_is_guest", "true"); localStorage.setItem("citypulse_saved_user", "Guest User"); window.location.replace('index.html'); }
    function proceedSuccess(userTag) { localStorage.setItem("citypulse_saved_user", userTag); localStorage.removeItem("citypulse_is_guest"); window.location.replace('index.html'); }

    async function handleEmailLogin() {
        const email = document.getElementById('user-email').value, password = document.getElementById('user-pass').value;
        if (!email || password.length < 6) return alert("Valid email & min 6 char password required.");
        let { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) await supabaseClient.auth.signUp({ email, password });
        proceedSuccess(email);
    }

    function sendOTP() { document.getElementById('step-phone').style.display = 'none'; document.getElementById('step-otp').style.display = 'block'; alert("Test OTP: 123456"); }
    function verifyOTP() { if (document.getElementById('user-otp').value === "123456") proceedSuccess("+91 " + document.getElementById('user-phone').value); else alert("Invalid OTP"); }

    async function loginWithGoogle() { await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + window.location.pathname.replace('login.html', 'index.html') } }); }
    
    async function handleBiometricAuth() {
        try {
            const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
            await navigator.credentials.get({ publicKey: { challenge, timeout: 60000, userVerification: "required" } });
            window.location.replace("index.html");
        } catch (err) { alert("Biometric failed. Use PIN/Password."); }
    }
</script>
</body>
</html>
