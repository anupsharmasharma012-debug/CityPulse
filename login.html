<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ==========================================
       [HTML] FILE HEADER & METADATA START
       ========================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Sign In & Security</title>
    <!-- [CSS] LINKED TO MASTER STYLESHEET -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* ==========================================
           [CSS] PAGE-SPECIFIC CUSTOM STYLES START
           ========================================== */
        :root { --success: #10b981; }
        body.dark-theme { --success: #34d399; }
        
        /* Header Layout Styles (No back button, short language icon on top right) */
        .header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .header h1 { font-size: 18px; font-weight: bold; }
        .lang-icon-btn { font-size: 18px; cursor: pointer; background: var(--card-bg); border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px; }

        /* Auth Tabs (Login vs Sign Up) */
        .auth-tabs { display: flex; background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; margin-top: 4px; }
        .auth-tab { flex: 1; text-align: center; padding: 10px; font-size: 12px; font-weight: bold; cursor: pointer; color: var(--text-sub); }
        .auth-tab.active { background: var(--primary); color: white; }

        /* Auth Container Card */
        .auth-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }

        .input-group { display: flex; align-items: center; gap: 10px; background: var(--bg-color); padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
        .input-icon { font-size: 16px; }
        .input-field { border: none; background: transparent; outline: none; font-size: 13px; color: var(--text-main); width: 100%; font-weight: 600; }

        .submit-btn { background: var(--primary); color: white; padding: 14px; border-radius: 8px; border: none; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Social Google Login Button */
        .google-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; font-size: 12px; font-weight: 700; color: var(--text-main); cursor: pointer; }

        /* Strict Checkbox & Terms Row Layout */
        .terms-container { display: flex; align-items: center; gap: 10px; background: var(--card-bg); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); }
        .terms-container input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0; }
        .terms-container label { font-size: 11px; color: var(--text-main); cursor: pointer; font-weight: 600; line-height: 1.3; }

        /* Biometric / Fingerprint Section */
        .bio-box { background: rgba(0, 122, 153, 0.05); border: 1px dashed var(--primary); border-radius: 12px; padding: 12px; text-align: center; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .bio-icon { font-size: 24px; }
        .bio-info { text-align: left; flex: 1; }
        .bio-title { font-size: 12px; font-weight: 800; color: var(--primary); }
        .bio-sub { font-size: 10px; color: var(--text-sub); }
        /* ==========================================
           [CSS] PAGE-SPECIFIC CUSTOM STYLES END
           ========================================== */
    </style>
</head>
<body>

<!-- ==========================================
   [HTML] MAIN CONTENT CONTAINER START
   ========================================== -->
<div class="page-container" style="padding-bottom: 20px;">
    
    <!-- [HTML] HEADER START (No back button, short language icon on top right) -->
    <div class="header">
        <h1>Sign In / Register</h1>
        <div class="lang-icon-btn" onclick="window.location.href='language.html'">🌐</div>
    </div>
    <!-- [HTML] HEADER END -->

    <!-- [HTML] AUTH TABS START -->
    <div class="auth-tabs">
        <div class="auth-tab active" id="tabLogin" onclick="switchAuthMode('login')">Sign In</div>
        <div class="auth-tab" id="tabSignup" onclick="switchAuthMode('signup')">Create Account</div>
    </div>
    <!-- [HTML] AUTH TABS END -->

    <!-- [HTML] LOGIN FORM CONTAINER START -->
    <div class="auth-card" id="areaLogin">
        <div style="font-size: 14px; font-weight: 800; color: var(--text-main);">Welcome Back to CityPulse</div>
        
        <!-- 1st: Google Sign In -->
        <div class="google-btn" onclick="alert('Redirecting to Google Sign-In...')">
            <span>🌐</span> Sign in with Google
        </div>

        <!-- 2nd: Email Sign In -->
        <div class="input-group">
            <span class="input-icon">📧</span>
            <input type="email" class="input-field" placeholder="Enter Email Address">
        </div>

        <!-- 3rd: Phone Number Sign In -->
        <div class="input-group">
            <span class="input-icon">📱</span>
            <input type="tel" class="input-field" placeholder="Enter Mobile Number / OTP">
        </div>

        <!-- Biometric Login Option -->
        <div class="bio-box" onclick="triggerBiometricLogin()">
            <div class="bio-icon">👆</div>
            <div class="bio-info">
                <div class="bio-title">Quick Biometric Login</div>
                <div class="bio-sub">Authenticate via Fingerprint / Face ID</div>
            </div>
        </div>

        <!-- 5th: Checkbox and Privacy & Policy (Must be checked to enable sign in) -->
        <div class="terms-container">
            <input type="checkbox" id="privacyCheckLogin" onchange="validateForm()">
            <label for="privacyCheckLogin">I agree to the Privacy Policy & Terms of Service under local compliance guidelines.</label>
        </div>

        <!-- 4th: Sign In / Sign Up Button -->
        <button class="submit-btn" id="loginBtn" disabled onclick="handleSuccessfulAuth()">Sign In to CityPulse</button>
    </div>
    <!-- [HTML] LOGIN FORM CONTAINER END -->

    <!-- [HTML] SIGNUP FORM CONTAINER START -->
    <div class="auth-card" id="areaSignup" style="display: none;">
        <div style="font-size: 14px; font-weight: 800; color: var(--text-main);">Join Bhatpara's Super App</div>
        
        <!-- 1st: Google Sign Up -->
        <div class="google-btn" onclick="alert('Redirecting to Google Sign-Up...')">
            <span>🌐</span> Continue with Google
        </div>

        <!-- 2nd: Email Input -->
        <div class="input-group">
            <span class="input-icon">📧</span>
            <input type="email" class="input-field" placeholder="Email Address">
        </div>

        <!-- 3rd: Phone Number Input -->
        <div class="input-group">
            <span class="input-icon">📱</span>
            <input type="tel" class="input-field" placeholder="Mobile Number">
        </div>

        <div class="input-group">
            <span class="input-icon">🔒</span>
            <input type="password" class="input-field" placeholder="Create Password">
        </div>

        <!-- Biometric Setup Option -->
        <div class="bio-box" onclick="alert('Biometric Fingerprint registered!')">
            <div class="bio-icon">👆</div>
            <div class="bio-info">
                <div class="bio-title">Enable Biometric Verification</div>
                <div class="bio-sub">Link fingerprint for instant access</div>
            </div>
        </div>

        <!-- 5th: Checkbox and Privacy & Policy -->
        <div class="terms-container">
            <input type="checkbox" id="privacyCheckSignup" onchange="validateForm()">
            <label for="privacyCheckSignup">I accept the Privacy Policy and local data protection guidelines.</label>
        </div>

        <!-- 4th: Register / Sign Up Button -->
        <button class="submit-btn" id="signupBtn" disabled style="background: var(--success);" onclick="handleSuccessfulAuth()">Register Account</button>
    </div>
    <!-- [HTML] SIGNUP FORM CONTAINER END -->

</div>
<!-- [HTML] MAIN CONTENT CONTAINER END -->

<!-- [JS] SCRIPT LOGIC START -->
<script>
    // Global Dark Mode Sync
    if (localStorage.getItem("citypulse_theme") === "dark") document.body.classList.add("dark-theme");

    // Switch between Login and Sign Up modes
    function switchAuthMode(mode) {
        document.getElementById('tabLogin').classList.remove('active');
        document.getElementById('tabSignup').classList.remove('active');
        document.getElementById('areaLogin').style.display = 'none';
        document.getElementById('areaSignup').style.display = 'none';

        if(mode === 'login') {
            document.getElementById('tabLogin').classList.add('active');
            document.getElementById('areaLogin').style.display = 'flex';
        } else {
            document.getElementById('tabSignup').classList.add('active');
            document.getElementById('areaSignup').style.display = 'flex';
        }
        validateForm();
    }

    // Strict validation: Button enables only when Privacy Policy checkbox is checked
    function validateForm() {
        const isLoginActive = document.getElementById('areaLogin').style.display !== 'none';
        if (isLoginActive) {
            const checked = document.getElementById('privacyCheckLogin').checked;
            document.getElementById('loginBtn').disabled = !checked;
        } else {
            const checked = document.getElementById('privacyCheckSignup').checked;
            document.getElementById('signupBtn').disabled = !checked;
        }
    }

    // Biometric Login Simulation
    function triggerBiometricLogin() {
        const isChecked = document.getElementById('privacyCheckLogin').checked;
        if (!isChecked) {
            alert("⚠️ Please check and agree to the Privacy Policy first.");
            return;
        }
        alert("👆 Biometric Verified Successfully! Logging in...");
        window.location.href = 'index.html';
    }

    // Successful Authentication Redirect to index.html
    function handleSuccessfulAuth() {
        alert("✅ Authentication Successful! Redirecting to CityPulse Home...");
        window.location.href = 'index.html';
    }
</script>
<!-- [JS] SCRIPT LOGIC END -->

</body>
</html>
