<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Login</title>

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #f4f6f9; 
            display: flex;
            justify-content: center;
        }
        
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #005C7A; 
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #splash-screen h1 { font-size: 42px; margin: 0; color: #ffffff; }
        #splash-screen p { font-size: 16px; color: #99cce0; margin-top: 8px; }
        
        .login-container { 
            width: 100%;
            max-width: 420px; 
            min-height: 100vh;
            background: linear-gradient(145deg, #007a99, #005C7A, #004865); 
            color: white;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            padding: 24px 20px;
            box-sizing: border-box;
            text-align: center;
            position: relative;
        }

        .login-lang-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }
        .login-lang-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }

        .logo-section h1 { font-size: 36px; margin: 0 0 12px 0; font-weight: bold; }
        .logo-circle { width: 100px; height: 100px; border: 3px solid white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 46px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .text-section h2 { font-size: 15px; font-weight: bold; margin: 0 0 8px 0; letter-spacing: 0.5px; }
        .text-section p { font-size: 13px; margin: 0; color: #b3e0ff; }
        
        .button-section { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .login-btn { background-color: rgba(255, 255, 255, 0.12); border: 1.5px solid rgba(255, 255, 255, 0.4); color: white; padding: 13px; border-radius: 30px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .login-btn:active { background-color: rgba(255, 255, 255, 0.3); }
        .bio-btn { background-color: #0284c7; border: 1.5px solid #38bdf8; display: none; }
        .footer-text { font-size: 11px; color: #b3e0ff; margin-top: 20px; line-height: 1.5; }
        .footer-text a { color: white; text-decoration: underline; font-weight: bold; }

        .auth-sub-box {
            display: none;
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            padding: 14px;
            border-radius: 15px;
            box-sizing: border-box;
        }

        .input-group {
            display: flex;
            align-items: center;
            background: #ffffff;
            border-radius: 25px;
            padding: 0 15px;
            margin: 6px auto;
            width: 100%;
            box-sizing: border-box;
        }
        .country-code {
            font-size: 13px;
            font-weight: bold;
            color: #333;
            padding-right: 8px;
            border-right: 1px solid #ccc;
        }
        .input-group input {
            border: none;
            outline: none;
            padding: 11px 10px;
            font-size: 14px;
            width: 100%;
            border-radius: 0 25px 25px 0;
            color: #333;
        }

        .otp-input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin: 6px auto;
            border-radius: 25px;
            border: 1px solid #fff;
            background: #ffffff;
            color: #333;
            font-size: 16px;
            outline: none;
            text-align: center;
            letter-spacing: 3px;
            font-weight: bold;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="splash-screen">
    <h1>CityPulse</h1>
    <p id="splash-text">Loading Municipal Portal...</p>
</div>

<div id="login-app" class="login-container">
    <button class="login-lang-btn" onclick="openLanguageSelector()">
        🌐 Language
    </button>

    <div class="logo-section">
        <h1>CityPulse</h1>
        <div class="logo-circle">🏙️</div> 
    </div>

    <div class="text-section">
        <h2>SIGN IN TO CITYPULSE</h2>
        <p>Access city services, alerts and civic utilities</p>
    </div>
    
    <div class="button-section">
        <button id="bio-auth-btn" class="login-btn bio-btn" onclick="handleBiometricAuth()">⚡ Fingerprint / Quick Unlock</button>
        
        <button class="login-btn" onclick="loginWithGoogle()">G Continue with Google</button>
      
        <button class="login-btn" onclick="toggleEmailBox()">✉️ Continue with email</button>
        <div id="email-auth-box" class="auth-sub-box">
            <div class="input-group">
                <input type="email" id="user-email" placeholder="Enter your email">
            </div>
            <div class="input-group">
                <input type="password" id="user-pass" placeholder="Password (min 6 chars)">
            </div>
            <button class="login-btn" style="padding: 10px; width: 100%; margin-top: 6px;" onclick="handleEmailLogin()">Sign In / Sign Up</button>
        </div>

        <button class="login-btn" onclick="togglePhoneBox()">📞 Continue with phone number</button>
        <div id="phone-auth-box" class="auth-sub-box">
            <div id="step-phone">
                <div class="input-group">
                    <span class="country-code">🇮🇳 +91</span>
                    <input type="tel" id="user-phone" placeholder="10-digit mobile number" maxlength="10">
                </div>
                <button class="login-btn" style="padding: 10px; width: 100%; margin-top: 6px;" onclick="sendOTP()">Send OTP</button>
            </div>
            <div id="step-otp" style="display: none;">
                <input type="text" id="user-otp" class="otp-input" placeholder="Enter OTP" maxlength="6">
                <button class="login-btn" style="padding: 10px; width: 100%; margin-top: 6px;" onclick="verifyOTP()">Verify & Login</button>
            </div>
        </div>

        <button class="login-btn" onclick="setGuestAndEnter()" style="border:none; text-decoration:underline;">Guest mode</button>
    </div>

    <div class="footer-text">
        By continuing, you agree to CityPulse's <br>
        <a href="#">TERMS OF USE</a> & <a href="#">PRIVACY POLICY</a>.
    </div>
</div>

<script>
    const SUPABASE_URL = "https://qfefkyrwxdhdxyajutst.supabase.co";
    const SUPABASE_KEY = "sb_publishable_mOjSpSn12VMJMf-0WWcDFg_h0u-YL5c";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    (async function initLogin() {
        const isCallback = window.location.search.includes("code=") || window.location.hash.includes("access_token");
        if (isCallback) {
            document.getElementById('splash-screen').style.display = 'flex';
            document.getElementById('splash-text').innerText = "Authenticating Google Login...";
            window.location.replace("index.html" + window.location.search + window.location.hash);
            return;
        }

        // Language change check bypass
        const justChangedLang = sessionStorage.getItem("lang_just_changed");
        if (justChangedLang) {
            sessionStorage.removeItem("lang_just_changed");
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('login-app').style.display = 'flex';
            return;
        }

        const savedUser = localStorage.getItem("citypulse_saved_user");
        const { data: { session } } = await supabaseClient.auth.getSession();
        
        if (session && session.user) {
            localStorage.setItem("citypulse_saved_user", session.user.email || "Active Resident");
            window.location.replace("index.html");
            return;
        } else if (savedUser) {
            window.location.replace("index.html");
            return;
        }

        setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('login-app').style.display = 'flex';
        }, 1200);
    })();

    function openLanguageSelector() {
        localStorage.setItem("citypulse_lang_ref", "login");
        sessionStorage.setItem("lang_just_changed", "true");
        window.location.href = 'language.html';
    }

    async function initBiometrics() {
        const bioBtn = document.getElementById('bio-auth-btn');
        if (window.PublicKeyCredential && bioBtn && localStorage.getItem("citypulse_bio_enrolled") === "true") {
            bioBtn.style.display = "block";
        }
    }
    initBiometrics();

    async function handleBiometricAuth() {
        try {
            const challenge = new Uint8Array(32);
            window.crypto.getRandomValues(challenge);
            const credential = await navigator.credentials.get({
                publicKey: { challenge, timeout: 60000, userVerification: "required" }
            });
            if (credential) {
                window.location.replace("index.html");
            }
        } catch (err) {
            window.location.replace("index.html");
        }
    }

    function togglePhoneBox() {
        const box = document.getElementById('phone-auth-box');
        document.getElementById('email-auth-box').style.display = 'none';
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    function toggleEmailBox() {
        const box = document.getElementById('email-auth-box');
        document.getElementById('phone-auth-box').style.display = 'none';
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    function setGuestAndEnter() {
        localStorage.setItem("citypulse_is_guest", "true");
        localStorage.setItem("citypulse_saved_user", "Guest User");
        window.location.replace('index.html');
    }

    function proceedSuccess(userTag) {
        localStorage.setItem("citypulse_saved_user", userTag);
        localStorage.removeItem("citypulse_is_guest");
        window.location.replace('index.html');
    }

    async function handleEmailLogin() {
        const email = document.getElementById('user-email').value.trim();
        const password = document.getElementById('user-pass').value.trim();

        if (!email || password.length < 6) {
            alert("Please enter a valid email and minimum 6 character password.");
            return;
        }

        let { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
            let signUp = await supabaseClient.auth.signUp({ email, password });
            if (signUp.error) {
                alert("Login Error: " + signUp.error.message);
                return;
            }
        }
        proceedSuccess(email);
    }

    function sendOTP() {
        const raw = document.getElementById('user-phone').value.trim();
        if (raw.length !== 10 || isNaN(raw)) {
            alert('Please enter a valid 10-digit mobile number');
            return;
        }
        alert('Test Mode OTP: 123456');
        document.getElementById('step-phone').style.display = 'none';
        document.getElementById('step-otp').style.display = 'block';
    }

    function verifyOTP() {
        const otp = document.getElementById('user-otp').value.trim();
        if (otp === "123456" || otp.length === 6) {
            const raw = document.getElementById('user-phone').value.trim();
            proceedSuccess("+91 " + raw);
        } else {
            alert("Invalid OTP! Please enter 123456 for demo.");
        }
    }

    async function loginWithGoogle() {
        try {
            const redirectUrl = window.location.origin + window.location.pathname.replace('login.html', 'index.html');
            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: redirectUrl }
            });
            if (error) throw error;
        } catch (err) {
            alert("Google Sign-In failed: " + err.message);
        }
    }
</script>
</body>
</html>
