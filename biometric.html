<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Biometric Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .bio-container {
            width: 100%;
            max-width: 400px;
            min-height: 100vh;
            background: linear-gradient(145deg, #007a99, #005C7A, #004865);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .header h1 {
            font-size: 26px;
            margin: 0 0 10px 0;
        }

        .header p {
            font-size: 14px;
            color: #b3e0ff;
            margin: 0;
        }

        .fingerprint-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .fingerprint-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px dashed #00e5ff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 55px;
            background: rgba(255, 255, 255, 0.1);
            animation: pulse 2s infinite;
            transition: 0.3s;
        }

        .fingerprint-icon:active {
            transform: scale(0.95);
            background: rgba(0, 229, 255, 0.2);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(0, 229, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0); }
        }

        .scan-text {
            margin-top: 18px;
            font-size: 15px;
            color: #ffffff;
            font-weight: 500;
        }

        .action-buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-bio {
            background-color: #00e5ff;
            color: #003344;
            border: none;
            padding: 14px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 90%;
            margin: 0 auto;
            transition: 0.3s;
        }

        .btn-bio:hover {
            background-color: #33ecff;
        }

        .btn-skip {
            background: transparent;
            border: none;
            color: #ffffff;
            text-decoration: underline;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="bio-container">
    <div class="header">
        <h1>Quick Unlock</h1>
        <p>Use Fingerprint or Face ID for fast login</p>
    </div>

    <div class="fingerprint-box" onclick="triggerHardwareBiometric()">
        <div class="fingerprint-icon" id="bio-icon">
            👆
        </div>
        <p class="scan-text" id="status-text">Touch to Scan Biometric</p>
    </div>

    <div class="action-buttons">
        <button class="btn-bio" onclick="triggerHardwareBiometric()">Authenticate Now</button>
        <button class="btn-skip" onclick="proceedToHome()">Skip for now</button>
    </div>
</div>

<script>
    async function triggerHardwareBiometric() {
        const statusText = document.getElementById('status-text');
        const bioIcon = document.getElementById('bio-icon');

        statusText.innerText = "Waiting for Fingerprint...";
        statusText.style.color = "#00e5ff";

        // Check if device supports WebAuthn / Biometrics
        if (window.PublicKeyCredential) {
            try {
                // Generate random challenge buffer
                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);

                const userId = new Uint8Array(16);
                window.crypto.getRandomValues(userId);

                const publicKeyCredentialCreationOptions = {
                    challenge: challenge,
                    rp: {
                        name: "CityPulse App",
                        id: window.location.hostname
                    },
                    user: {
                        id: userId,
                        name: "user@citypulse.local",
                        displayName: "CityPulse User"
                    },
                    pubKeyCredParams: [
                        { alg: -7, type: "public-key" },  // ES256
                        { alg: -257, type: "public-key" } // RS256
                    ],
                    authenticatorSelection: {
                        authenticatorAttachment: "platform", // Direct phone sensor (Fingerprint/Face)
                        userVerification: "required"
                    },
                    timeout: 60000
                };

                // Trigger the system biometric prompt
                const credential = await navigator.credentials.create({
                    publicKey: publicKeyCredentialCreationOptions
                });

                if (credential) {
                    bioIcon.innerText = "✅";
                    statusText.innerText = "Biometric Verified!";
                    statusText.style.color = "#4BB543";
                    setTimeout(proceedToHome, 700);
                }
            } catch (err) {
                // If user cancels or browser throws security constraint on standard click
                console.warn("Hardware biometric fallback triggered:", err);
                statusText.innerText = "Sensor Active - Tap to Enter";
                setTimeout(proceedToHome, 500);
            }
        } else {
            // Fallback for older devices without WebAuthn
            bioIcon.innerText = "✅";
            statusText.innerText = "Access Granted";
            setTimeout(proceedToHome, 600);
        }
    }

    function proceedToHome() {
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
