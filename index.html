<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Dashboard</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; }
        .header { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; text-align: center; }
        .form-container { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 500px; margin: 0 auto; }
        .form-container h3 { margin-top: 0; margin-bottom: 20px; color: #0f172a; }
        label { font-size: 14px; font-weight: 500; color: #475569; display: block; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; margin-bottom: 16px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
        button:hover { background: #1d4ed8; }
        #saveMsg { margin-top: 15px; font-weight: 500; text-align: center; font-size: 14px; }
    </style>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Yeh Header hai jo upar dikhega -->
    <div class="header">
        <h2>CityPulse Dashboard 🏙️</h2>
        <p style="color: #64748b; margin: 0;">Admin Control Panel</p>
    </div>

    <!-- Data Add Karne ka Form yahan hai -->
    <div class="form-container">
        <h3>Nayi Travel Entry Add Karein 🏔️</h3>
        
        <label>Title:</label>
        <input type="text" id="placeTitle" placeholder="Jaise: Spiti Valley Tour">

        <label>Location:</label>
        <input type="text" id="placeLocation" placeholder="Jaise: Kalpa, Kaza, Dhankar">

        <button onclick="saveData()">Save Data</button>
        
        <p id="saveMsg"></p>
    </div>

    <!-- Database Bridge aur Logic yahan se shuru hai -->
    <script src="db.js"></script>
    <script>
        // 1. Check karna ki user login hai ya nahi
        async function checkLogin() {
            if (typeof checkUserSession === 'undefined') return;
            const session = await checkUserSession();
            if (!session) {
                // Agar login nahi hai, wapas login page par bhej do
                window.location.replace("login.html");
            }
        }
        
        // Page load hote hi login check chalega
        checkLogin();

        // 2. Data save karne ka function
        async function saveData() {
            const titleVal = document.getElementById('placeTitle').value;
            const locVal = document.getElementById('placeLocation').value;
            const msg = document.getElementById('saveMsg');

            if (!titleVal || !locVal) {
                msg.style.color = "#dc2626"; // Red
                msg.innerText = "Bhai, dono fields bharna zaroori hai!";
                return;
            }

            msg.style.color = "#2563eb"; // Blue
            msg.innerText = "Data Supabase ja raha hai...";

            // Aapki db.js ka function use kar rahe hain
            const payload = { title: titleVal, location: locVal };
            const response = await insertTableData('travel_places', payload);

            if (response.success) {
                msg.style.color = "#16a34a"; // Green
                msg.innerText = "Data successfully save ho gaya! 🎉";
                
                // Form ko clear kar do agli entry ke liye
                document.getElementById('placeTitle').value = ""; 
                document.getElementById('placeLocation').value = "";
            } else {
                msg.style.color = "#dc2626"; // Red
                msg.innerText = "Error: " + response.error;
            }
        }
    </script>
</body>
</html>
