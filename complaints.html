<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Geo-Tagged Complaints & Voting</title>
    <!-- [CSS] LINKED TO MASTER STYLESHEET -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* ==========================================
           [CSS] PAGE-SPECIFIC CUSTOM STYLES START
           ========================================== */
        :root { --accent: #10b981; }
        body.dark-theme { --accent: #10b981; }

        /* Header Layout Styles */
        .header { display: flex; align-items: center; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .back-btn { background: none; border: none; font-size: 22px; color: var(--text-main); cursor: pointer; }
        .header h1 { font-size: 18px; font-weight: bold; }

        /* Tabs for Submission vs Voting Styles */
        .tabs { display: flex; background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
        .tab { flex: 1; text-align: center; padding: 12px; font-size: 12px; font-weight: bold; cursor: pointer; color: var(--text-sub); }
        .tab.active { background: var(--primary); color: white; }

        /* Form Area Styles */
        .form-area { display: flex; flex-direction: column; gap: 12px; }
        .form-input, .form-textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-color); color: var(--text-main); font-size: 13px; outline: none; }
        .form-textarea { height: 80px; resize: none; }
        
        /* Geo-Tag Button Styles */
        .geo-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; background: rgba(16, 185, 129, 0.1); color: var(--accent); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
        .upload-box { border: 2px dashed var(--border); padding: 16px; text-align: center; border-radius: 8px; cursor: pointer; color: var(--text-sub); font-size: 12px; }
        .submit-btn { background: var(--primary); color: white; padding: 14px; border-radius: 8px; border: none; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 4px; }

        /* Community Voting System Styles */
        .voting-area { display: none; flex-direction: column; gap: 12px; }
        .issue-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; gap: 12px; }
        .vote-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .vote-btn { background: rgba(0, 122, 153, 0.1); color: var(--primary); border: none; width: 32px; height: 32px; border-radius: 6px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .vote-count { font-size: 14px; font-weight: bold; color: var(--text-main); }
        .issue-details { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .issue-title { font-size: 13px; font-weight: 700; color: var(--text-main); }
        .issue-meta { font-size: 10px; color: var(--text-sub); display: flex; gap: 8px; align-items: center; }
        .status-badge { background: #fef08a; color: #854d0e; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: bold; text-transform: uppercase; }
        /* ==========================================
           [CSS] PAGE-SPECIFIC CUSTOM STYLES END
           ========================================== */
    </style>
</head>
<body>

<!-- [HTML] MAIN CONTENT CONTAINER START -->
<div class="page-container">
    
    <!-- [HTML] HEADER SECTION START -->
    <div class="header">
        <div class="header-left">
            <button class="back-btn" onclick="history.back()">←</button>
            <h1>Jan Shikayat</h1>
        </div>
    </div>
    <!-- [HTML] HEADER SECTION END -->

    <!-- [HTML] TOGGLE SYSTEM TABS START -->
    <div class="tabs">
        <div class="tab active" id="tabNew" onclick="switchTab('new')">New Complaint</div>
        <div class="tab" id="tabVote" onclick="switchTab('vote')">Community Voting</div>
    </div>
    <!-- [HTML] TOGGLE SYSTEM TABS END -->

    <!-- [HTML] GEO-TAGGED SUBMISSION FORM START -->
    <div class="form-area" id="areaNew">
        <select class="form-input">
            <option>Select Category (Water, Road, Garbage)</option>
        </select>
        <textarea class="form-textarea" placeholder="Describe the civic issue clearly..."></textarea>
        
        <!-- Strict Rule Feature: Geo-Tagging Button -->
        <button class="geo-btn" onclick="alert('GPS Location Fetched: Ward 14, Lat 22.82, Lon 88.40 (Geo-Tag Added)')">
            📍 Auto-Fetch Geo-Tag (Required)
        </button>
        
        <div class="upload-box" onclick="alert('Opening Camera...')">📸 Add Live Photo</div>
        <button class="submit-btn" onclick="alert('Geo-Tagged Complaint Submitted to Municipality!')">Submit to Auth</button>
    </div>
    <!-- [HTML] GEO-TAGGED SUBMISSION FORM END -->

    <!-- [HTML] COMMUNITY VOTING SYSTEM START -->
    <div class="voting-area" id="areaVote">
        <div style="font-size: 11px; color: var(--text-sub); margin-bottom: 4px;">Top voted issues are fast-tracked to officials.</div>
        
        <div class="issue-card">
            <div class="vote-col">
                <button class="vote-btn" onclick="alert('Upvoted!')">▲</button>
                <span class="vote-count">142</span>
            </div>
            <div class="issue-details">
                <div class="issue-title">Broken Streetlight near Ghosh Para Crossing</div>
                <div class="issue-meta">
                    <span class="status-badge">Under Review</span>
                    <span>📍 Ward 14</span>
                </div>
            </div>
        </div>

        <div class="issue-card">
            <div class="vote-col">
                <button class="vote-btn" onclick="alert('Upvoted!')">▲</button>
                <span class="vote-count">89</span>
            </div>
            <div class="issue-details">
                <div class="issue-title">Irregular garbage collection for 3 days</div>
                <div class="issue-meta">
                    <span class="status-badge" style="background:#bbf7d0; color:#166534;">Resolved</span>
                    <span>📍 Ward 10</span>
                </div>
            </div>
        </div>
    </div>
    <!-- [HTML] COMMUNITY VOTING SYSTEM END -->

</div>
<!-- [HTML] MAIN CONTENT CONTAINER END -->

<!-- [HTML] MODERN 5-TAB BOTTOM NAVIGATION START -->
<div class="bottom-nav">
    <a href="index.html" class="nav-item">
        <div class="nav-icon">🏠</div><span>Home</span>
    </a>
    <a href="search.html" class="nav-item">
        <div class="nav-icon">🔍</div><span>Search</span>
    </a>
    <a href="pay.html" class="nav-item">
        <div class="nav-icon">🛡️</div><span>Pay</span>
    </a>
    <a href="category.html" class="nav-item active">
        <div class="nav-icon">📂</div><span>Category</span>
    </a>
    <a href="notifications.html" class="nav-item">
        <div class="nav-icon">🔔</div><span>Alerts</span>
    </a>
</div>
<!-- [HTML] MODERN 5-TAB BOTTOM NAVIGATION END -->

<!-- [JS] SCRIPT LOGIC START -->
<script>
    // Global Dark Mode Sync
    if (localStorage.getItem("citypulse_theme") === "dark") document.body.classList.add("dark-theme");
    
    // Function to switch between New Complaint form and Community Voting feed
    function switchTab(type) {
        document.getElementById('tabNew').classList.remove('active');
        document.getElementById('tabVote').classList.remove('active');
        document.getElementById('areaNew').style.display = 'none';
        document.getElementById('areaVote').style.display = 'none';

        if(type === 'new') {
            document.getElementById('tabNew').classList.add('active');
            document.getElementById('areaNew').style.display = 'flex';
        } else {
            document.getElementById('tabVote').classList.add('active');
            document.getElementById('areaVote').style.display = 'flex';
        }
    }
</script>
<!-- [JS] SCRIPT LOGIC END -->

</body>
</html>
