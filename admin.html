<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Master Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: #131824;
            --card-border: #222b3d;
            --accent: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); margin: 0; padding: 15px; color: var(--text-main); }
        .max-container { max-width: 750px; margin: 0 auto; }
        .header-box { background: linear-gradient(135deg, #1e1b4b, #0f172a); border: 1px solid var(--accent); padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(59,130,246,0.2); }
        
        .card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        
        label { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 5px; display: block; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--card-border); border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; background: #0b0e14; color: #fff; font-family: inherit; font-size: 14px; transition: border 0.2s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
        
        .btn { background: var(--accent); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; font-size: 15px; text-transform: uppercase; letter-spacing: 0.5px; transition: background 0.2s; }
        .btn:hover { background: #2563eb; }
        
        .admin-item { display: flex; justify-content: space-between; align-items: center; background: #0b0e14; padding: 14px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--card-border); }
        .badge { font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 4px; background: #1e3a8a; color: #93c5fd; text-transform: uppercase; }
        .action-btn { padding: 6px 12px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 11px; text-transform: uppercase; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="max-container">
        <div class="header-box">
            <h2 style="margin:0; font-weight: 900; font-size: 22px;">🎛️ CityPulse Master Backend</h2>
            <p style="margin: 5px 0 0; font-size: 12px; color: #93c5fd;">Manage FB Live, JioTV Channels, Ads & Headlines</p>
        </div>

        <div class="card">
            <h3 style="margin-top:0; border-bottom: 1px solid var(--card-border); padding-bottom: 10px;">➕ Add / Edit Content</h3>
            
            <input type="hidden" id="editId" value="">

            <label>1. Content Placement (Kahan dikhana hai?)</label>
            <select id="itemCategory">
                <optgroup label="🏠 Home Page Elements">
                    <option value="Home_HeroFB">🔴 Top FB Live / Local Channel Carousel</option>
                    <option value="Home_AdBanner">📢 Local Sponsored Ad Banner</option>
                </optgroup>
                <optgroup label="📺 Media Feed Elements (JioTV Style)">
                    <option value="Feed_LiveBubble">⚪ Live TV Round Channel Logo (Top Row)</option>
                    <option value="Feed_Headline">⚡ Big Cinematic Headline (16:9 Card)</option>
                    <option value="News_Standard">📰 Standard News/Crime Card</option>
                </optgroup>
            </select>
            
            <label>2. Main Title / Channel Name</label>
            <input type="text" id="itemTitle" placeholder="e.g. Bhatpara Live Official / Breaking News Title">
            
            <label>3. Subtitle / Description (Choti Detail)</label>
            <input type="text" id="itemDesc" placeholder="e.g. Live Ground Reporting / Flat 50% Off">

            <label>4. Tag / Badge (Upar dikhne wala label)</label>
            <input type="text" id="itemBadge" placeholder="e.g. FB LIVE / SPONSORED / CRIME">

            <label>5. HD Image / Logo URL (HD Photo ka link)</label>
            <input type="text" id="itemImage" placeholder="https://images.unsplash.com/...">
            
            <label>6. Video Embed Code or Action Link (Facebook/YouTube Link)</label>
            <textarea id="itemLink" rows="2" placeholder='<iframe src="..."></iframe> OR https://facebook.com/...'></textarea>
            
            <button class="btn" onclick="saveContent()" id="submitBtn">🚀 Publish Live</button>
            <p id="msg" style="text-align:center; font-weight:700; font-size:13px; margin-top:12px;"></p>
        </div>

        <div class="card">
            <h3 style="margin-top:0; border-bottom: 1px solid var(--card-border); padding-bottom: 10px;">📋 Live Network Manager (Edit/Delete/Hide)</h3>
            <div id="adminList">Loading database...</div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://qfefkyrwxdhdxyajutst.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmZWZreXJ3eGRoZHh5YWp1dHN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMjY0ODcsImV4cCI6MjEwMjgwMjQ4N30.lmnKyvigM5JeVf1y_BR0tjqAp4PiXioZNcCE5VVYsKg';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function saveContent() {
            const editId = document.getElementById('editId').value;
            const category = document.getElementById('itemCategory').value;
            const title = document.getElementById('itemTitle').value.trim();
            const desc = document.getElementById('itemDesc').value.trim();
            const badge = document.getElementById('itemBadge').value.trim();
            const image = document.getElementById('itemImage').value.trim();
            const link = document.getElementById('itemLink').value.trim();
            const msg = document.getElementById('msg');
            
            if(!title) return msg.innerHTML = '<span style="color:#ef4444;">⚠️ Title is mandatory!</span>';

            // Smart JSON bundling without changing database structure
            const payloadData = JSON.stringify({ desc, badge, image, link });

            msg.style.color = '#3b82f6';
            msg.innerText = 'Processing...';

            let error;
            if (editId) {
                // Update existing
                const res = await supabaseClient.from('media_hub').update({ title, category, location: payloadData }).eq('id', editId);
                error = res.error;
            } else {
                // Insert new
                const res = await supabaseClient.from('media_hub').insert([{ title, category, location: payloadData, status: 'active' }]);
                error = res.error;
            }
            
            if(error) {
                msg.innerHTML = `<span style="color:#ef4444;">Error: ${error.message}</span>`;
            } else {
                msg.innerHTML = '<span style="color:#10b981;">✅ Successfully Published to Network!</span>';
                resetForm();
                loadAdminList();
            }
        }

        function resetForm() {
            document.getElementById('editId').value = '';
            document.getElementById('itemTitle').value = '';
            document.getElementById('itemDesc').value = '';
            document.getElementById('itemBadge').value = '';
            document.getElementById('itemImage').value = '';
            document.getElementById('itemLink').value = '';
            document.getElementById('submitBtn').innerText = '🚀 Publish Live';
            document.getElementById('submitBtn').style.background = 'var(--accent)';
        }

        function startEdit(id, title, category, locationData) {
            document.getElementById('editId').value = id;
            document.getElementById('itemTitle').value = title;
            document.getElementById('itemCategory').value = category;
            
            try {
                let parsed = JSON.parse(locationData);
                document.getElementById('itemDesc').value = parsed.desc || '';
                document.getElementById('itemBadge').value = parsed.badge || '';
                document.getElementById('itemImage').value = parsed.image || '';
                document.getElementById('itemLink').value = parsed.link || '';
            } catch(e) {
                // For old data format
                document.getElementById('itemLink').value = locationData;
            }
            
            document.getElementById('submitBtn').innerText = '💾 Update Content';
            document.getElementById('submitBtn').style.background = '#10b981';
            window.scrollTo(0, 0);
        }

        async function loadAdminList() {
            const { data } = await supabaseClient.from('media_hub').select('*').order('created_at', { ascending: false });
            const listDiv = document.getElementById('adminList');
            
            if(!data || data.length === 0) return listDiv.innerHTML = `<p style="color:#64748b; font-size:13px;">No items found in database.</p>`;
            
            let html = '';
            data.forEach(item => {
                const isHidden = item.status === 'hidden';
                html += `
                    <div class="admin-item" style="${isHidden ? 'opacity:0.5; border-color:#ef4444;' : ''}">
                        <div>
                            <div style="font-weight:700; font-size:14px; margin-bottom:4px;">${item.title}</div>
                            <span class="badge">${item.category.replace('_', ' ')}</span>
                            ${isHidden ? '<span class="badge" style="background:#450a0a; color:#fca5a5;">HIDDEN</span>' : ''}
                        </div>
                        <div style="display:flex; flex-direction:column; gap:6px;">
                            <button onclick="startEdit('${item.id}', '${item.title.replace(/'/g, "\\'")}', '${item.category}', '${(item.location || '').replace(/'/g, "\\'")}')" class="action-btn" style="background:#3b82f6; color:white;">Edit</button>
                            <div style="display:flex; gap:6px;">
                                <button onclick="toggleStatus('${item.id}', '${item.status}')" class="action-btn" style="background:#f59e0b; color:black;">${isHidden ? 'Show' : 'Hide'}</button>
                                <button onclick="deleteItem('${item.id}')" class="action-btn" style="background:#ef4444; color:white;">Del</button>
                            </div>
                        </div>
                    </div>`;
            });
            listDiv.innerHTML = html;
        }

        async function toggleStatus(id, currentStatus) {
            await supabaseClient.from('media_hub').update({ status: currentStatus === 'active' ? 'hidden' : 'active' }).eq('id', id);
            loadAdminList();
        }

        async function deleteItem(id) {
            if(confirm('🚨 WARNING: Are you sure you want to permanently delete this item?')) {
                await supabaseClient.from('media_hub').delete().eq('id', id);
                loadAdminList();
            }
        }

        loadAdminList();
    </script>
</body>
</html>
