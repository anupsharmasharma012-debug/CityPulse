<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Admin Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; margin: 0; padding: 20px; color: #1e293b; }
        .header { background: #ffffff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.04); margin-bottom: 24px; text-align: center; }
        .header h1 { margin: 0 0 6px 0; color: #0f172a; font-size: 24px; }
        .header p { color: #64748b; margin: 0; font-size: 14px; }
        
        .max-container { max-width: 600px; margin: 0 auto; }
        .card { background: #ffffff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.04); margin-bottom: 20px; }
        .card h3 { margin-top: 0; margin-bottom: 16px; color: #0f172a; font-size: 18px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
        
        label { font-size: 13px; font-weight: 600; color: #475569; display: block; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 10px 12px; margin-bottom: 14px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #fff; font-family: 'Inter', sans-serif; }
        textarea { resize: vertical; height: 80px; }
        
        button.primary-btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: background 0.2s; }
        button.primary-btn:hover { background: #1d4ed8; }
        #saveMsg { margin-top: 12px; font-weight: 500; text-align: center; font-size: 13px; }
        
        .admin-item { background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #e2e8f0; position: relative; }
        .admin-title { font-weight: 600; font-size: 14px; color: #0f172a; padding-right: 120px; }
        .admin-cat { font-size: 11px; color: #2563eb; font-weight: 600; margin-top: 4px; }
        
        .action-btns { position: absolute; right: 10px; top: 10px; display: flex; gap: 5px; }
        .hide-btn { background: #fef3c7; color: #d97706; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: 600; }
        .hide-btn:hover { background: #fde68a; }
        .delete-btn { background: #fee2e2; color: #dc2626; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: 600; }
        .delete-btn:hover { background: #fecaca; }
        
        .nav-link { display: block; text-align: center; margin-top: 20px; color: #2563eb; text-decoration: none; font-weight: 600; font-size: 14px; }
        .nav-link:hover { text-decoration: underline; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="header">
        <h1>CityPulse Admin Portal ⚙️</h1>
        <p>Advanced Control: Publish, Hide, or Unhide</p>
    </div>

    <div class="max-container">
        <div class="card">
            <h3>📢 Naya Channel / News Publish Karein</h3>
            
            <label>Ise kahan dikhana hai? (Target Category):</label>
            <select id="itemCategory">
                <option value="News">📰 News (Papa / Dosto ke liye)</option>
                <option value="Cartoon">🎨 Cartoon (Beta ke liye)</option>
                <option value="Entertainment">🎬 Entertainment (Family ke liye)</option>
            </select>

            <label>Channel / Title Name:</label>
            <input type="text" id="itemTitle" placeholder="Jaise: Aaj Tak Live / Chhota Bheem">

            <label>YouTube Embed Code / Link:</label>
            <textarea id="itemLocation" placeholder="Yahan YouTube ka iframe embed code dalein..."></textarea>

            <button class="primary-btn" onclick="saveData()">Publish to Public App</button>
            <p id="saveMsg"></p>
        </div>

        <div class="card">
            <h3>🗂️ Manage Channels (Hide / Unhide / Delete)</h3>
            <div id="adminList">
                <p style="color: #64748b; font-size: 13px;">Loading channels...</p>
            </div>
        </div>

        <a href="index.html" class="nav-link" target="_blank">🌐 View Live Public App &rarr;</a>
    </div>

    <script>
        const SUPABASE_URL = 'https://qfefkyrwxdhdxyajutst.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmZWZreXJ3eGRoZHh5YWp1dHN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMjY0ODcsImV4cCI6MjEwMjgwMjQ4N30.lmnKyvigM5JeVf1y_BR0tjqAp4PiXioZNcCE5VVYsKg';
        
        const localSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function saveData() {
            const catVal = document.getElementById('itemCategory').value;
            const titleVal = document.getElementById('itemTitle').value;
            const locVal = document.getElementById('itemLocation').value;
            const msg = document.getElementById('saveMsg');

            if (!titleVal || !locVal) {
                msg.style.color = "#dc2626";
                msg.innerText = "Bhai, title aur details bharna zaroori hai!";
                return;
            }

            msg.style.color = "#2563eb";
            msg.innerText = "Publish ho raha hai...";

            try {
                const { error } = await localSupabase
                    .from('media_hub')
                    .insert([{ 
                        category: catVal, 
                        title: titleVal, 
                        location: locVal,
                        status: 'active' 
                    }]);

                if (error) throw error;

                msg.style.color = "#16a34a";
                msg.innerText = "Successfully publish ho gaya! 🎉";
                document.getElementById('itemTitle').value = ""; 
                document.getElementById('itemLocation').value = "";
                
                fetchAdminData();
            } catch (err) {
                msg.style.color = "#dc2626";
                msg.innerText = "Error: " + err.message;
            }
        }

        async function fetchAdminData() {
            const adminListContainer = document.getElementById('adminList');
            
            try {
                const { data, error } = await localSupabase
                    .from('media_hub')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    adminListContainer.innerHTML = '<p style="color: #64748b; font-size: 13px;">Koi channel nahi hai.</p>';
                    return;
                }

                let adminHtml = '';
                data.forEach(item => {
                    const currentStatus = item.status || 'active';
                    const isHidden = currentStatus === 'hidden';
                    
                    const hideBtnText = isHidden ? 'Unhide 👁️' : 'Hide 🙈';
                    const hideBtnClass = isHidden ? 'style="background: #dcfce7; color: #16a34a;"' : '';
                    
                    adminHtml += `
                        <div class="admin-item" style="${isHidden ? 'opacity: 0.6;' : ''}">
                            <div class="action-btns">
                                <button class="hide-btn" ${hideBtnClass} onclick="toggleHide('${item.id}', '${currentStatus}')">${hideBtnText}</button>
                                <button class="delete-btn" onclick="deleteItem('${item.id}')">Delete</button>
                            </div>
                            <div class="admin-title">📌 ${item.title} ${isHidden ? '(Hidden)' : ''}</div>
                            <div class="admin-cat">Category: [ ${item.category} ]</div>
                        </div>
                    `;
                });

                adminListContainer.innerHTML = adminHtml;

            } catch (err) {
                adminListContainer.innerHTML = `<p style="color: #dc2626; font-size: 13px;">Error loading list</p>`;
            }
        }

        async function toggleHide(id, currentStatus) {
            const newStatus = (currentStatus === 'hidden') ? 'active' : 'hidden';

            try {
                const { error } = await localSupabase
                    .from('media_hub')
                    .update({ status: newStatus })
                    .eq('id', id);

                if (error) throw error;
                fetchAdminData();
            } catch (err) {
                alert("Status update error: " + err.message);
            }
        }

        async function deleteItem(id) {
            if (!confirm("Kya aap sach mein is channel ko hamesha ke liye delete karna chahte hain?")) return;

            try {
                const { error } = await localSupabase
                    .from('media_hub')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                fetchAdminData();
            } catch (err) {
                alert("Delete error: " + err.message);
            }
        }

        fetchAdminData();
    </script>
</body>
</html>
